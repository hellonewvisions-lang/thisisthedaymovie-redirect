<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting to New Visions Films</title>
    <meta name="robots" content="noindex,follow">
    <meta http-equiv="refresh" content="0; url=https://www.ournewvisions.com/films">
    <link rel="canonical" href="https://www.ournewvisions.com/films">
    <script>
      const destination = new URL("https://www.ournewvisions.com/films");
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination.href);
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="https://www.ournewvisions.com/films">New Visions Films</a>.</p>
  </body>
</html>
